<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: KannadaFont;
      src: url("../../fonts/NotoSansKannada-Bold.ttf");
    }

    @font-face {
      font-family: DevanagariFont;
      src: url("../../fonts/NotoSansDevanagari-Bold.ttf");
    }

    @font-face {
      font-family: TamilFont;
      src: url("../../fonts/NotoSansTamil-Bold.ttf");
    }

    @font-face {
      font-family: TeluguFont;
      src: url("../../fonts/NotoSansTelugu-Bold.ttf");
    }

    @font-face {
      font-family: MalayalamFont;
      src: url("../../fonts/NotoSansMalayalam-Bold.ttf");
    }

    @font-face {
      font-family: BengaliFont;
      src: url("../../fonts/NotoSansBengali-Bold.ttf");
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 1280px;
      height: 720px;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: #f8fafc;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    .slide {
      height: 100%;
      padding: 56px 72px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      /* 🔑 VERY IMPORTANT */
      overflow: hidden;
    }

    /* TITLE — SAFE SIZE */
    .title {
      font-size: 40px;
      /* 🔑 reduced */
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 20px;
      line-height: 1.2;
      max-height: 96px;
      /* 2 lines max */
      overflow: hidden;
      word-break: break-word;
    }

    /* BULLET TEXT */
    .bullet {
      font-size: 26px;
      /* 🔑 reduced */
      line-height: 1.35;
      margin: 12px 0;
      padding-left: 24px;
      position: relative;
      color: #e5e7eb;
      max-height: 72px;
      /* ~2 lines */
      overflow: hidden;
      word-break: break-word;
    }

    /* BULLET DOT */
    .bullet::before {
      content: "•";
      position: absolute;
      left: 0;
      top: 2px;
      color: #38bdf8;
      font-size: 26px;
    }

    /* SUBTITLE (OPTIONAL) */
    .subtitle {
      font-size: 22px;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.3;
      max-height: 56px;
      overflow: hidden;
    }

    /* FOOTER */
    .footer {
      margin-top: auto;
      font-size: 16px;
      color: #64748b;
      align-self: flex-end;
    }

    /* EXAMPLES SECTION */
    .examples-section {
      margin-top: 20px;
      padding: 16px 20px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid #38bdf8;
      border-radius: 8px;
      max-width: 100%;
      max-height: 200px;
      /* 🔑 Limit height to prevent overflow */
      overflow: hidden;
      word-wrap: break-word;
    }

    .examples-title {
      font-size: 20px;
      /* 🔑 Reduced from 22px */
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .examples-title::before {
      content: "💡";
      font-size: 20px;
      /* 🔑 Reduced from 24px */
      flex-shrink: 0;
    }

    .example-item {
      font-size: 18px;
      /* 🔑 Reduced from 20px */
      line-height: 1.3;
      /* 🔑 Tighter line height */
      margin: 6px 0;
      /* 🔑 Reduced from 8px */
      padding-left: 20px;
      position: relative;
      color: #cbd5e1;
      word-wrap: break-word;
      word-break: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      /* 🔑 Enable hyphenation */
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      /* 🔑 Add ellipsis for very long text */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      /* 🔑 Limit to 2 lines per example */
      -webkit-box-orient: vertical;
    }

    .example-item::before {
      content: "→";
      position: absolute;
      left: 0;
      top: 2px;
      color: #38bdf8;
      font-weight: bold;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="slide" id="slide">
    <!-- injected by puppeteer -->
  </div>
</body>

</html>
