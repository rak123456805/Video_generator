<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
 @font-face {
  font-family: KannadaFont;
  src: url("../../fonts/NotoSansKannada-Bold.ttf");
}
@font-face {
  font-family: DevanagariFont;
  src: url("../../fonts/NotoSansDevanagari-Bold.ttf");
}
@font-face {
  font-family: TamilFont;
  src: url("../../fonts/NotoSansTamil-Bold.ttf");
}
@font-face {
  font-family: TeluguFont;
  src: url("../../fonts/NotoSansTelugu-Bold.ttf");
}
@font-face {
  font-family: MalayalamFont;
  src: url("../../fonts/NotoSansMalayalam-Bold.ttf");
}
@font-face {
  font-family: BengaliFont;
  src: url("../../fonts/NotoSansBengali-Bold.ttf");
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 1280px;
  height: 720px;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: #f8fafc;
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  overflow: hidden; /* HARD STOP */
}

/* SLIDE CONTAINER */
.slide {
  height: 100%;
  padding: 56px 72px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start; /* 🔑 VERY IMPORTANT */
  overflow: hidden;
}

/* TITLE — SAFE SIZE */
.title {
  font-size: 40px; /* 🔑 reduced */
  font-weight: 700;
  color: #38bdf8;
  margin-bottom: 20px;
  line-height: 1.2;
  max-height: 96px; /* 2 lines max */
  overflow: hidden;
  word-break: break-word;
}

/* BULLET TEXT */
.bullet {
  font-size: 26px; /* 🔑 reduced */
  line-height: 1.35;
  margin: 12px 0;
  padding-left: 24px;
  position: relative;
  color: #e5e7eb;
  max-height: 72px; /* ~2 lines */
  overflow: hidden;
  word-break: break-word;
}

/* BULLET DOT */
.bullet::before {
  content: "•";
  position: absolute;
  left: 0;
  top: 2px;
  color: #38bdf8;
  font-size: 26px;
}

/* SUBTITLE (OPTIONAL) */
.subtitle {
  font-size: 22px;
  color: #94a3b8;
  margin-bottom: 16px;
  line-height: 1.3;
  max-height: 56px;
  overflow: hidden;
}

/* FOOTER */
.footer {
  margin-top: auto;
  font-size: 16px;
  color: #64748b;
  align-self: flex-end;
}



  </style>
</head>
<body>
  <div class="slide" id="slide">
    <!-- injected by puppeteer -->
  </div>
</body>
</html>
